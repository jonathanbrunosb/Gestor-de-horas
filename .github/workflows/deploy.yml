name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          # Domínio próprio (public/CNAME) é servido na raiz — base é '/'.
          # Se o CNAME for removido e o site voltar a usar o domínio padrão
          # <usuario>.github.io/<repo>/, troque para /${{ github.event.repository.name }}/.
          GITHUB_PAGES_BASE: /
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Create 404.html for SPA client-side routing
        # GitHub Pages não tem roteamento de servidor: ao recarregar (F5) ou
        # abrir diretamente uma rota do React Router (ex.: /dashboard), ele
        # procura um arquivo físico nesse caminho e retorna 404. Servindo uma
        # cópia do index.html como 404.html, o app carrega normalmente e o
        # BrowserRouter assume o roteamento a partir da URL já na barra de
        # endereço (truque padrão para SPAs no GitHub Pages).
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
